<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevOps Control Panel</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: radial-gradient(circle at top, #1b1b1b, #0d0d0d);
  color: #fff;
}

/* HEADER */
.header {
  text-align: center;
  padding: 28px 10px 10px;
}

.header h1 {
  font-size: 1.8rem;
  background: linear-gradient(135deg, #ff9800, #ff3d00);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin: 0;
}

.header p {
  font-size: 0.8rem;
  color: rgba(255,255,255,0.4);
  letter-spacing: 2px;
  margin-top: 6px;
}

/* MAIN CARD */
.container {
  max-width: 650px;
  margin: 20px auto;
  padding: 25px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 18px;
  backdrop-filter: blur(12px);
  box-shadow: 0 0 25px rgba(0,0,0,0.4);
}

/* STATUS */
.status {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 18px;
}

.box {
  padding: 14px;
  border-radius: 12px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
}

.box small {
  color: rgba(255,255,255,0.4);
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
  margin-right: 6px;
}

.green { background:#00e676; box-shadow:0 0 8px #00e676; }
.blue { background:#29b6f6; box-shadow:0 0 8px #29b6f6; }
.orange { background:#ff9800; box-shadow:0 0 8px #ff9800; }

/* MESSAGES */
.messages {
  height: 220px;
  overflow-y: auto;
  padding: 10px;
  background: rgba(0,0,0,0.25);
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.08);
  margin-bottom: 15px;
}

.msg {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px;
  margin-bottom: 8px;
  background: rgba(255,255,255,0.06);
  border-radius: 10px;
  font-size: 0.85rem;
}

.msg i {
  color: #ff9800;
}

/* INPUT */
.input-box {
  display: flex;
  gap: 10px;
}

input {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.05);
  color: #fff;
  outline: none;
}

input:focus {
  border-color: #ff9800;
  box-shadow: 0 0 10px rgba(255,152,0,0.3);
}

button {
  padding: 12px 18px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(135deg, #ff9800, #ff3d00);
  color: #fff;
  font-weight: 600;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 5px 15px rgba(255,100,0,0.3);
}
</style>
</head>

<body>

<div class="header">
  <h1>DEVOPS CONTROL PANEL</h1>
  <p>FLASK • MYSQL • DOCKER • AWS</p>
</div>

<div class="container">

  <!-- STATUS -->
  <div class="status">
    <div class="box">
      <small>Flask App</small><br>
      <span class="dot green"></span> Running
    </div>
    <div class="box">
      <small>Database</small><br>
      <span class="dot green"></span> Connected
    </div>
    <div class="box">
      <small>Network</small><br>
      <span class="dot blue"></span> Docker Bridge
    </div>
    <div class="box">
      <small>Deploy</small><br>
      <span class="dot orange"></span> EC2 Live
    </div>
  </div>

  <!-- MESSAGES -->
  <div class="messages" id="msgBox">

    {% for message in messages %}
      <div class="msg">
        <i class="ti ti-terminal-2"></i>
        {{ message[0] }}
      </div>
    {% endfor %}

  </div>

  <!-- INPUT -->
  <div class="input-box">
    <input type="text" id="msgInput" placeholder="Enter log message...">
    <button onclick="sendMsg()">SEND</button>
  </div>

</div>

<script>
function sendMsg() {
  let input = document.getElementById("msgInput");
  let val = input.value.trim();
  if (!val) return;

  fetch("/submit", {
    method: "POST",
    headers: {
      "Content-Type": "application/x-www-form-urlencoded"
    },
    body: "new_message=" + encodeURIComponent(val)
  })
  .then(res => res.json())
  .then(data => {
    let box = document.getElementById("msgBox");

    let div = document.createElement("div");
    div.className = "msg";
    div.innerHTML = `<i class="ti ti-terminal-2"></i> ${data.message}`;

    box.appendChild(div);
    box.scrollTop = box.scrollHeight;

    input.value = "";
  });
}

document.getElementById("msgInput").addEventListener("keydown", function(e){
  if(e.key === "Enter") sendMsg();
});
</script>

</body>
</html>
